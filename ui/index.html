<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Excalidraw · Holon</title>
    <meta name="description" content="A shared Excalidraw board that people and agents draw on together." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Holon Labs" />
    <meta property="og:title" content="Excalidraw · Holon" />
    <meta property="og:description" content="People and AI agents draw on one board, live. Share the link, and bring your agent over MCP." />
    <meta property="og:image" content="https://excalidraw.holonlabs.io/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A person and an AI agent drawing an architecture diagram together, each with a cursor" />
    <meta property="og:video" content="https://excalidraw.holonlabs.io/og.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1200" />
    <meta property="og:video:height" content="630" />
    <!-- X ignores og:video; its player card embeds og-player.html instead. -->
    <meta name="twitter:card" content="player" />
    <meta name="twitter:site" content="@HolonLabsDev" />
    <meta name="twitter:image" content="https://excalidraw.holonlabs.io/og.png" />
    <meta name="twitter:player" content="https://excalidraw.holonlabs.io/og-player.html" />
    <meta name="twitter:player:width" content="1200" />
    <meta name="twitter:player:height" content="630" />
    <meta name="twitter:player:stream" content="https://excalidraw.holonlabs.io/og.mp4" />
    <meta name="twitter:player:stream:content_type" content="video/mp4" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <!--
      Excalidraw and React load from esm.sh, as Excalidraw's fonts do. The view
      an MCP Apps host embeds is a single file, which they would make megabytes.
    -->
    <link
      rel="stylesheet"
      href="https://esm.sh/@excalidraw/excalidraw@%VITE_EXCALIDRAW%/dist/prod/index.css"
    />
    <script type="importmap">
      {
        "imports": {
          "@excalidraw/excalidraw": "https://esm.sh/@excalidraw/excalidraw@%VITE_EXCALIDRAW%/dist/prod/index.js?external=react,react-dom",
          "react": "https://esm.sh/react@19.2.0",
          "react/jsx-runtime": "https://esm.sh/react@19.2.0/jsx-runtime",
          "react-dom": "https://esm.sh/react-dom@19.2.0",
          "react-dom/client": "https://esm.sh/react-dom@19.2.0/client"
        }
      }
    </script>
  </head>
  <body>
    <div id="board"></div>
    <p id="status" role="alert"></p>
    <script type="module" src="/main.ts"></script>
  </body>
</html>

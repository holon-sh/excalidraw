<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 108 1100 492" width="1100" height="492" role="img" aria-label="A browser page, an agent in Claude Code and the board embedded in a Claude chat all call the same MCP endpoint, POST /mcp/excalidraw">
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ink { fill: #1f1f1c; }
    .muted { fill: #76736b; }
    .panel { fill: #fbfaf7; stroke: #d8d4c8; stroke-width: 1.5; }
    .shape { fill: #fff; stroke: #1e1e1e; stroke-width: 2; }
    .line { stroke: #1e1e1e; stroke-width: 2; fill: none; }
    .call { stroke: #3a3a36; stroke-width: 1.5; fill: none; }
    .bubble { fill: #ebe8e0; }
    .card { fill: #fff; stroke: #d8d4c8; stroke-width: 1.25; }
  </style>
  <defs>
    <radialGradient id="holon-orb" cx="28%" cy="23%" r="78%">
      <stop offset="0" stop-color="#f3f1eb" />
      <stop offset="57%" stop-color="#e4e2dc" />
      <stop offset="100%" stop-color="#c9c8c0" />
    </radialGradient>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e" />
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a36" />
    </marker>
  </defs>

  <rect width="1100" height="600" fill="#f2efe7" />

  <!-- The board in a browser tab -->
  <rect x="70" y="148" width="340" height="300" rx="10" class="panel" />
  <path d="M70,190 V158 a10,10 0 0 1 10,-10 H400 a10,10 0 0 1 10,10 V190 z" fill="#eeebe3" />
  <circle cx="90" cy="169" r="5" fill="#ec6a5e" />
  <circle cx="106" cy="169" r="5" fill="#f4bf4f" />
  <circle cx="122" cy="169" r="5" fill="#61c554" />
  <rect x="140" y="156" width="190" height="34" rx="7" fill="#fbfaf7" />
  <svg x="152" y="164" width="16" height="16" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#f2efe7" stroke="#d8d4c8" stroke-width="2" /><circle cx="32" cy="32" r="21" fill="url(#holon-orb)" /></svg>
  <text x="175" y="178" class="sans ink" font-size="13">Excalidraw · Holon</text>
  <rect x="84" y="200" width="312" height="26" rx="13" fill="#efece5" />
  <text x="100" y="218" class="sans muted" font-size="13">excalidraw.holonlabs.io/?board=demo</text>
  <rect x="92" y="262" width="104" height="48" rx="9" class="shape" />
  <text x="144" y="291" class="sans ink" font-size="15" text-anchor="middle">Browser</text>
  <rect x="276" y="262" width="116" height="48" rx="9" class="shape" />
  <text x="334" y="291" class="sans ink" font-size="15" text-anchor="middle">MCP server</text>
  <path d="M200,286 H272" class="line" marker-end="url(#head)" />
  <text x="236" y="279" class="sans ink" font-size="12" text-anchor="middle">MCP</text>
  <rect x="276" y="354" width="116" height="48" rx="9" class="shape" fill="#a5d8ff" style="fill:#a5d8ff" />
  <text x="334" y="383" class="sans ink" font-size="15" text-anchor="middle">AI agent</text>
  <path d="M334,352 V314" class="line" marker-end="url(#head)" />
  <text x="342" y="338" class="sans ink" font-size="12">MCP</text>
  <path d="M150,346 l0,16 l4.5,-4.5 l3,7 l3,-1.3 l-3,-7 l6.5,0 z" fill="#2f9e44" />
  <rect x="160" y="364" width="74" height="20" rx="6" fill="#b2f2bb" />
  <text x="197" y="378" class="sans ink" font-size="12" font-weight="600" text-anchor="middle">Guest 550</text>
  <path d="M352,380 l0,16 l4.5,-4.5 l3,7 l3,-1.3 l-3,-7 l6.5,0 z" fill="#e64980" />
  <rect x="362" y="398" width="44" height="20" rx="6" fill="#fcc2d7" />
  <text x="384" y="412" class="sans ink" font-size="12" font-weight="600" text-anchor="middle">Agent</text>

  <!-- An agent in Claude Code -->
  <rect x="425" y="148" width="295" height="300" rx="10" class="panel" />
  <text x="443" y="178" class="sans" font-size="17" fill="#d97757">✳</text>
  <text x="463" y="178" class="sans ink" font-size="15" font-weight="600">Claude Code</text>
  <path d="M425,192 H720" stroke="#e4e0d5" stroke-width="1.25" />
  <rect x="478" y="206" width="228" height="56" rx="10" class="bubble" />
  <text x="492" y="229" class="sans ink" font-size="13">Add an AI agent, and connect it</text>
  <text x="492" y="249" class="sans ink" font-size="13">with arrows labelled MCP.</text>
  <rect x="440" y="276" width="266" height="64" rx="8" class="card" />
  <text x="454" y="298" class="sans muted" font-size="12">Used a tool</text>
  <text x="454" y="322" class="mono ink" font-size="12.5">draw(board="demo", shapes=…)</text>
  <text x="440" y="368" class="sans ink" font-size="13">Done. The agent is on the board.</text>
  <rect x="440" y="404" width="266" height="30" rx="8" class="card" />
  <text x="454" y="424" class="sans muted" font-size="12.5">Reply to Claude…</text>

  <!-- The board embedded in a Claude chat -->
  <rect x="735" y="148" width="295" height="300" rx="10" class="panel" />
  <text x="753" y="178" class="sans" font-size="17" fill="#d97757">✳</text>
  <text x="773" y="178" class="sans ink" font-size="15" font-weight="600">Claude</text>
  <path d="M735,192 H1030" stroke="#e4e0d5" stroke-width="1.25" />
  <rect x="818" y="206" width="198" height="34" rx="10" class="bubble" />
  <text x="832" y="228" class="sans ink" font-size="13">Open our architecture board.</text>
  <rect x="750" y="254" width="266" height="138" rx="8" class="card" />
  <svg x="762" y="264" width="18" height="18" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#f2efe7" stroke="#d8d4c8" stroke-width="2" /><circle cx="32" cy="32" r="21" fill="url(#holon-orb)" /></svg>
  <text x="788" y="278" class="sans ink" font-size="12.5" font-weight="600">Excalidraw · Holon</text>
  <rect x="764" y="300" width="70" height="32" rx="7" class="shape" stroke-width="1.5" />
  <text x="799" y="320" class="sans ink" font-size="11" text-anchor="middle">Browser</text>
  <rect x="878" y="300" width="82" height="32" rx="7" class="shape" stroke-width="1.5" />
  <text x="919" y="320" class="sans ink" font-size="11" text-anchor="middle">MCP server</text>
  <path d="M836,316 H874" class="line" stroke-width="1.5" marker-end="url(#head)" />
  <rect x="878" y="350" width="82" height="32" rx="7" class="shape" stroke-width="1.5" style="fill:#a5d8ff" />
  <text x="919" y="370" class="sans ink" font-size="11" text-anchor="middle">AI agent</text>
  <path d="M919,348 V336" class="line" stroke-width="1.5" marker-end="url(#head)" />
  <rect x="750" y="404" width="266" height="30" rx="8" class="card" />
  <text x="764" y="424" class="sans muted" font-size="12.5">Reply to Claude…</text>

  <!-- Every surface makes the same calls -->
  <path d="M240,454 V500" class="call" marker-start="url(#tip)" marker-end="url(#tip)" />
  <text x="252" y="473" class="serif ink" font-size="14">tools/call</text>
  <text x="252" y="491" class="serif ink" font-size="14">events/stream</text>
  <path d="M572,454 V500" class="call" marker-start="url(#tip)" marker-end="url(#tip)" />
  <text x="584" y="482" class="serif ink" font-size="14">tools/call</text>
  <path d="M882,454 V500" class="call" marker-start="url(#tip)" marker-end="url(#tip)" />
  <text x="894" y="482" class="serif ink" font-size="14">tools/call</text>

  <rect x="70" y="504" width="960" height="56" fill="#3d4733" />
  <text x="94" y="539" class="serif" font-size="22" font-weight="700" fill="#f2efe7">Server</text>
  <text x="186" y="538" class="mono" font-size="16" fill="#e7e3d6">POST /mcp/excalidraw</text>
</svg>

# Publishes the image to Docker Hub and the server to the MCP Registry
# when a tag v<version> is pushed, where <version> is the version in server.json.
name: Release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag against server.json
        run: |
          version=$(jq -r .version server.json)
          image=$(jq -r '.packages[] | select(.registryType == "oci") | .identifier' server.json)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::Tag $GITHUB_REF_NAME is not v$version"; exit 1; }
          test "$image" = "docker.io/holonlabs/excalidraw:$version" || { echo "::error::The image in server.json is $image"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci && npm test

      - uses: docker/setup-buildx-action@v3
      # Signs in as the holonlabs organization through Docker's OIDC connection, which
      # lets this repository's v* tags push holonlabs/excalidraw. No token is stored.
      - uses: docker/login-action@v4
        env:
          DOCKERHUB_OIDC_CONNECTIONID: 503c17c8-2ed4-4ec8-9eb8-47c6f799e171
        with:
          username: holonlabs
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/holonlabs/excalidraw:${{ env.VERSION }}
            docker.io/holonlabs/excalidraw:latest

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish to the MCP Registry
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          base=https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
